# goreleaser v2 configuration. `just release-snapshot` builds every target
# locally; the release workflow publishes on a v* tag.
version: 2

project_name: baum

before:
  hooks:
    # Fail instead of rewriting go.mod after goreleaser checked the tree is clean.
    - go mod tidy -diff
    # Rebuild the viewer and fail when the result differs from the committed
    # internal/viewer/dist, which go build embeds, so no archive ships a stale
    # bundle. Needs Node.js and pnpm; the release workflow sets
    # BAUM_SKIP_VIEWER_FRESH because a read-only job has checked it.
    - sh scripts/viewer-fresh.sh

builds:
  - id: baum
    main: ./cmd/baum
    binary: baum
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/baumai/baum/internal/cli.buildVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"

release:
  github:
    owner: baumai
    name: baum
  draft: false
  prerelease: auto
