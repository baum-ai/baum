# goreleaser v2 configuration. `just release-snapshot` builds every target
# locally; the release workflow publishes on a v* tag.
version: 2

project_name: baum

before:
  hooks:
    # Fail instead of rewriting go.mod after goreleaser checked the tree is clean.
    - go mod tidy -diff
    # Build the viewer and local app, which go build embeds, so a snapshot
    # ships them; on a release commit, which carries them, fail when they
    # differ from the fresh build, so no archive ships a stale bundle. Needs
    # Node.js and pnpm; the release workflow sets BAUM_SKIP_VIEWER_FRESH
    # because a read-only job has checked the release commit.
    - sh scripts/viewer-fresh.sh

builds:
  - id: baum
    main: ./cmd/baum
    binary: baum
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/baum-ai/baum/internal/cli.buildVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

# Commit subjects are not release notes (and may name internal tracking
# identifiers); a person writes the notes on the draft release.
changelog:
  disable: true

release:
  github:
    owner: baum-ai
    name: baum
  # The release workflow attaches the desktop app and then publishes the
  # draft, so nobody sees a release without it. A re-run reuses the draft
  # and replaces its files instead of creating a second one.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
