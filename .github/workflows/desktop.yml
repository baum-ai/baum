name: Desktop bundles

# Builds the desktop app's bundles, unsigned, on each platform with
# desktop/scripts/bundle.sh and uploads them as the artifact
# desktop-<platform>. Check calls it on pull requests and main for snapshots;
# Release calls it on a version tag with the bundled baum binaries goreleaser
# built. This workflow takes no secrets: compiling runs hundreds of crates'
# build scripts and the bundler's downloads, so signing happens later, in
# Release jobs that build nothing. See desktop/README.md.

on:
  workflow_call:
    inputs:
      version:
        description: Version without the leading v; 0.0.0 for snapshots, which never check for updates
        type: string
        required: true
      cli-artifact:
        description: Artifact holding goreleaser's dist/baum_<os>_<arch>*/ binaries; empty builds them from source
        type: string
        default: ""
      apps-artifact:
        description: For a build from source, the artifact holding the built viewer/dist and localapp/dist, which only a release commit carries
        type: string
        default: ""
      finalize-macos:
        description: Also run macos-finalize.sh (ad hoc signing, disk image, updater archive) in the bundle job
        type: boolean
        default: false
      windows:
        description: Also build the Windows installer; the release skips it while Windows is not released
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bundle:
    name: Desktop bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      # A plain list rather than include entries, because exclude applies
      # before include and could not drop an included platform.
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-universal, windows-amd64]
        exclude:
          - platform: ${{ !inputs.windows && 'windows-amd64' || 'none' }}
    runs-on: ${{ fromJSON('{"linux-amd64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-universal":"macos-15","windows-amd64":"windows-2025"}')[matrix.platform] }}
    # linux-arm64 runners are free for public repositories; a failure there
    # does not hold up the other platforms or the updater manifest.
    continue-on-error: ${{ matrix.platform == 'linux-arm64' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.platform }}
      CLI_ARTIFACT: ${{ inputs.cli-artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: inputs.cli-artifact == ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Without them, the bundled daemon would answer the app's window with a
      # note that it was built without its web app.
      - name: Download the built apps
        if: inputs.cli-artifact == '' && inputs.apps-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.apps-artifact }}
          path: internal

      - name: Set up pnpm for the desktop frontend
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js for the desktop frontend
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1

      - name: Build the React application and desktop setup
        working-directory: .
        run: pnpm --dir viewer install --frozen-lockfile && pnpm --dir app install --frozen-lockfile && pnpm --dir app build

      - name: Build the bundled baum binaries
        if: inputs.cli-artifact == ''
        run: |
          case "$PLATFORM" in
            linux-amd64) sh desktop/scripts/sidecar.sh x86_64-unknown-linux-gnu ;;
            linux-arm64) sh desktop/scripts/sidecar.sh aarch64-unknown-linux-gnu ;;
            darwin-universal)
              sh desktop/scripts/sidecar.sh aarch64-apple-darwin
              sh desktop/scripts/sidecar.sh x86_64-apple-darwin
              ;;
            windows-amd64) sh desktop/scripts/sidecar.sh x86_64-pc-windows-msvc ;;
          esac

      - name: Download the release's baum binaries
        if: inputs.cli-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.cli-artifact }}
          path: cli-dist

      # The app bundles the very binaries the CLI release archives hold.
      - name: Use the release's baum binaries
        if: inputs.cli-artifact != ''
        run: |
          shopt -s nullglob
          mkdir -p desktop/binaries
          # goreleaser puts each build in dist/baum_<os>_<arch>[_<variant>]/.
          take() {
            local found=(cli-dist/baum_"$1"*/baum"$3")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected one baum binary for $1 in $CLI_ARTIFACT, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" "desktop/binaries/baum-$2$3"
            chmod 0755 "desktop/binaries/baum-$2$3"
          }
          case "$PLATFORM" in
            linux-amd64) take linux_amd64 x86_64-unknown-linux-gnu "" ;;
            linux-arm64) take linux_arm64 aarch64-unknown-linux-gnu "" ;;
            darwin-universal)
              take darwin_arm64 aarch64-apple-darwin ""
              take darwin_amd64 x86_64-apple-darwin ""
              ;;
            windows-amd64) take windows_amd64 x86_64-pc-windows-msvc .exe ;;
          esac

      - name: Combine the macOS binaries
        if: matrix.platform == 'darwin-universal'
        working-directory: desktop/binaries
        run: |
          lipo -create -output baum-universal-apple-darwin baum-aarch64-apple-darwin baum-x86_64-apple-darwin
          lipo baum-universal-apple-darwin -verify_arch arm64 x86_64

      - name: Set up Rust
        if: runner.os != 'Linux'
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          if [ "$PLATFORM" = darwin-universal ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      # Snapshots reuse the Tauri CLI; release builds compile it afresh.
      - name: Cache the Tauri CLI
        if: runner.os != 'Linux' && inputs.cli-artifact == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.12.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Tauri CLI
        if: runner.os != 'Linux'
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -qx 'tauri-cli 2.12.3'; then
            cargo install --locked tauri-cli --version 2.12.3
          fi

      # Snapshots reuse the compiled dependencies of the last snapshot for
      # the platform and Linux build image; release builds compile everything
      # afresh. Keep native output from the old Ubuntu 22.04 image separate.
      - name: Cache the Rust build output
        if: inputs.cli-artifact == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            desktop/target/*/release/build
            desktop/target/*/release/deps
            desktop/target/*/release/.fingerprint
          key: desktop-bundle-noble-${{ matrix.platform }}-${{ hashFiles('desktop/Dockerfile') }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-bundle-noble-${{ matrix.platform }}-${{ hashFiles('desktop/Dockerfile') }}-

      # Linux bundles are built on Ubuntu 24.04, the oldest supported
      # distribution, in the same image as `just desktop::bundle`. Snapshots
      # reuse the image's layers from the Actions cache; release builds build
      # it afresh.
      - name: Set up Docker builder for the snapshot image
        if: runner.os == 'Linux' && inputs.cli-artifact == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the Linux build image (snapshot)
        if: runner.os == 'Linux' && inputs.cli-artifact == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: desktop
          load: true
          push: false
          provenance: false
          tags: baum-desktop-build
          cache-from: type=gha,scope=desktop-build-${{ matrix.platform }}
          cache-to: type=gha,scope=desktop-build-${{ matrix.platform }},mode=max

      - name: Build the Linux build image
        if: runner.os == 'Linux' && inputs.cli-artifact != ''
        run: docker build --tag baum-desktop-build desktop

      - name: Build the bundles (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm --volume "$PWD:/oss" --workdir /oss/desktop \
            baum-desktop-build scripts/bundle.sh "$PLATFORM" "$VERSION" target/release-bundles
          sudo chown -R "$(id -u):$(id -g)" desktop/target

      - name: Build the bundles
        if: runner.os != 'Linux'
        working-directory: desktop
        run: bash scripts/bundle.sh "$PLATFORM" "$VERSION" target/release-bundles

      # Exercises the release's macOS packaging on every snapshot; without
      # Apple secrets it signs ad hoc.
      - name: Package the macOS app
        if: matrix.platform == 'darwin-universal' && inputs.finalize-macos
        working-directory: desktop
        run: |
          bash scripts/macos-finalize.sh target/release-bundles/baum-desktop-darwin-universal.app.tar \
            "$VERSION" target/release-bundles

      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/target/release-bundles/
          if-no-files-found: error
          retention-days: 14
