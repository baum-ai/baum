name: Release

# On a version tag of a release commit: a commit on main (or on a release/*
# branch) plus the built
# viewer and local app, which no other commit carries, so go install of the tag
# needs only Go. The monorepo's "Tag an open-source release" workflow makes it.
#
#   viewer-dist
#     -> release (goreleaser: CLI archives into a draft GitHub release)
#     -> desktop (desktop.yml: unsigned bundles, no secrets)
#     -> sign-macos, sign-linux (environment "release")
#     -> desktop-manifest (latest.json, latest*.yml checks, checksums; read-only)
#     -> desktop-publish (attach, then publish the draft)
#   test, desktop-test run beside them; desktop-publish waits for both, so
#   nothing is published until they pass. The tagging workflow already ran
#   the Go tests on this commit, so they only gate publishing here.
#
# Signing secrets live only in the "release" environment, which needs an
# approval and accepts only v* tags. Only the sign jobs use it, and they
# compile nothing: they run Apple's signing tools, a pinned minisign and this
# repository's scripts (bash, and Node.js scripts with no dependencies) on
# bundles built without secrets. Actions are pinned to
# commits. See desktop/README.md.
#
# The Windows desktop installer is not released for now: desktop.yml skips
# its bundle here (Check's snapshots still build it), and nothing signs or
# publishes it. The CLI's Windows archives are unaffected.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    # The race-enabled tests alone take about 8.5 minutes with no cache;
    # v0.3.1's first run passed 10 and was cancelled, leaving the draft
    # unpublished.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches anywhere in this workflow: a release never restores files
      # another run saved.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # The release commit carries the built apps, so their tests must run.
      # Skips the second a race-enabled binary sleeps as it exits; see check.yml.
      - name: Test
        env:
          BAUM_REQUIRE_UI: "1"
          GORACE: atexit_sleep_ms=0
        run: go test -race ./...

  viewer-dist:
    # The tag must carry the viewer and local app its sources build to.
    name: Viewer bundle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1

      - name: Rebuild and compare
        env:
          BAUM_RELEASE_COMMIT: "1"
        run: sh scripts/viewer-fresh.sh

  desktop-test:
    # The tag's desktop code passes the checks Check runs on pull requests.
    name: Desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1

      - name: Install the desktop app's dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check, typecheck and unit tests
        run: pnpm check

      - name: Updater signing and manifest checks
        run: |
          bash scripts/updater-manifest-test.sh
          bash scripts/update-yml-test.sh

  release:
    name: Release
    needs: viewer-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        # A test version (1.2.3-test.1) is never released: the desktop app
        # takes its update feed and key from the environment only in a test
        # build (desktop/electron/main/updater.ts, testOverrides).
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-test([.+]|$) ]]; then
            echo "::error::$version is a test version of the desktop app, which is never released"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # goreleaser calls the release API with GITHUB_TOKEN from the
          # environment and never pushes, so no credentials stay in the clone.
          persist-credentials: false

      # Only a reviewed commit is released: the tag must point at a release
      # commit whose one parent is on main or a release/* branch, past the
      # previous release, and which adds nothing but the built apps.
      # viewer-dist checks those match their sources. The tagging workflow ran
      # the same checks before pushing the tag.
      - name: The tag is a release commit of a commit on main or a release branch, newer than the last release
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          # shellcheck disable=SC2046 # one argument per branch; ref names have no spaces
          sh scripts/release-check.sh "$GITHUB_REF_NAME" origin/main \
            $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/)

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module downloads
        run: go mod verify

      # The notes are the tag's version section of CHANGELOG.md on main, read
      # from origin/main rather than the tagged commit: a release candidate is
      # promoted from the commit it was made from, which predates notes written
      # since. The script runs as it is on main too, because the tagged commit
      # may predate it. Both are data for this script only; nothing is built
      # from them. A stable tag without notes fails here, before anything is
      # created. Until the script reaches main, notes stay empty.
      - name: Write the release notes from the changelog on main
        run: |
          if git cat-file -e origin/main:scripts/release-notes.sh 2>/dev/null; then
            git show origin/main:scripts/release-notes.sh > "$RUNNER_TEMP/release-notes.sh"
            git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
            sh "$RUNNER_TEMP/release-notes.sh" "$GITHUB_REF_NAME" "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/release-notes.md"
          else
            echo "::notice::scripts/release-notes.sh is not on main yet; the release has no notes."
            : > "$RUNNER_TEMP/release-notes.md"
          fi

      # Builds linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 and
      # windows/amd64 with CGO off, archives them, writes checksums.txt and
      # creates a draft GitHub release with the notes above (see
      # .goreleaser.yaml); desktop-publish publishes it.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          # The viewer-dist job, which has a read-only token, already checked
          # the bundle, so the before hook skips it: no JavaScript tooling
          # runs while this job holds a token that can write to the repository.
          BAUM_SKIP_VIEWER_FRESH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The desktop bundles carry these exact binaries.
      - name: Keep the baum binaries for the desktop app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: |
            dist/baum_*/baum
            dist/baum_*/baum.exe
          if-no-files-found: error
          retention-days: 7

  desktop:
    # No secrets: this compiles the app.
    name: Desktop
    needs: release
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
      cli-artifact: cli-binaries
      windows: false

  sign-macos:
    # Apple's tools, a pinned minisign and this repository's scripts only.
    name: Sign the macOS app
    needs: [release, desktop]
    environment: release
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # updater-sign.sh and updater-manifest.sh then use only the pinned
      # minisign (MINISIGN), never one on PATH.
      BAUM_RELEASE_SIGNING: "1"
    outputs:
      updater: ${{ steps.signing.outputs.updater }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-darwin-universal
          path: unsigned

      - name: Signing configuration
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          has() { if [ -n "$1" ]; then echo true; else echo false; fi; }
          {
            echo "updater=$(has "$TAURI_SIGNING_PRIVATE_KEY")"
            echo "apple=$(has "$APPLE_CERTIFICATE")"
            echo "apple-api-key=$(has "$APPLE_API_PRIVATE_KEY")"
          } >>"$GITHUB_OUTPUT"
          if [ -n "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE is set without APPLE_SIGNING_IDENTITY"
            exit 1
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          (umask 077; printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12")
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Write the App Store Connect API key
        if: steps.signing.outputs.apple == 'true' && steps.signing.outputs.apple-api-key == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          (umask 077; printf '%s\n' "$APPLE_API_PRIVATE_KEY" >"$RUNNER_TEMP/AuthKey.p8")
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"

      - name: Sign, notarise and package
        env:
          APPLE: ${{ steps.signing.outputs.apple }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without the certificate nothing Apple-related applies: ad hoc.
          if [ "$APPLE" != true ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          bash desktop/scripts/macos-finalize.sh unsigned/baum-desktop-darwin-universal.app.tar \
            "$VERSION" signed

      - name: Install minisign
        if: steps.signing.outputs.updater == 'true'
        run: |
          minisign=$(bash desktop/scripts/install-minisign.sh "$RUNNER_TEMP/minisign")
          echo "MINISIGN=$minisign" >>"$GITHUB_ENV"

      # macos-finalize.sh wrote latest-mac.yml from the signed zip; every file
      # it lists, and the .app.tar.gz latest.json points at, gets a .sig.
      - name: Sign the updater files
        if: steps.signing.outputs.updater == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          files=()
          while IFS= read -r file; do files+=("signed/$file"); done \
            < <(node desktop/scripts/update-yml.mjs check "$VERSION" signed latest-mac.yml)
          bash desktop/scripts/updater-sign.sh "$VERSION" signed/*.app.tar.gz "${files[@]}"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi

      - name: Keep the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-darwin-universal
          path: signed/
          if-no-files-found: error
          retention-days: 7

  sign-linux:
    # A pinned minisign and this repository's scripts only.
    name: Sign the Linux updater files
    needs: [release, desktop]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # updater-sign.sh and updater-manifest.sh then use only the pinned
      # minisign (MINISIGN), never one on PATH.
      BAUM_RELEASE_SIGNING: "1"
    outputs:
      updater: ${{ steps.signing.outputs.updater }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the x86_64 bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-amd64
          path: unsigned/linux-amd64

      # Missing when the optional arm64 build failed.
      - name: Download the arm64 bundles
        id: arm64
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-arm64
          path: unsigned/linux-arm64

      # Each platform's own files only, so no artifact can supply another's.
      - name: Take the bundles
        env:
          ARM64: ${{ steps.arm64.outcome }}
        run: |
          mkdir signed
          cp unsigned/linux-amd64/baum-desktop-linux-amd64.deb unsigned/linux-amd64/baum-desktop-linux-amd64.AppImage \
            unsigned/linux-amd64/latest-linux.yml signed/
          if [ "$ARM64" = success ]; then
            cp unsigned/linux-arm64/baum-desktop-linux-arm64.deb unsigned/linux-arm64/baum-desktop-linux-arm64.AppImage \
              unsigned/linux-arm64/latest-linux-arm64.yml signed/
          fi
          # The update files must describe the bundles beside them.
          node desktop/scripts/update-yml.mjs check "$VERSION" signed >/dev/null

      - name: Signing configuration
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >>"$GITHUB_OUTPUT"
          else
            echo "updater=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install minisign
        if: steps.signing.outputs.updater == 'true'
        run: |
          minisign=$(bash desktop/scripts/install-minisign.sh "$RUNNER_TEMP/minisign")
          echo "MINISIGN=$minisign" >>"$GITHUB_ENV"

      # Every file the update files list (the AppImages and the debs), which
      # includes the AppImages latest.json points at.
      - name: Sign the updater files
        if: steps.signing.outputs.updater == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          files=()
          while IFS= read -r file; do files+=("signed/$file"); done \
            < <(node desktop/scripts/update-yml.mjs check "$VERSION" signed)
          bash desktop/scripts/updater-sign.sh "$VERSION" "${files[@]}"

      - name: Keep the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-linux
          path: signed/
          if-no-files-found: error
          retention-days: 7

  desktop-manifest:
    # Read-only: writes latest.json and checksums, checks every bundle
    # against the release key and the version, and the update files'
    # hashes against the bundles, before anything is published.
    name: Desktop updater manifest
    needs: [release, sign-macos, sign-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.release.outputs.version }}
      BAUM_RELEASE_SIGNING: "1"
      # Whether the release environment holds the updater key, as each sign
      # job saw it.
      UPDATER: ${{ needs.sign-linux.outputs.updater }}
      UPDATER_MACOS: ${{ needs.sign-macos.outputs.updater }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the signed macOS files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-darwin-universal
          path: signed/darwin-universal

      - name: Download the signed Linux files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-linux
          path: signed/linux

      # Each platform contributes only its own names, and no name twice.
      - name: Collect the release files
        run: |
          mkdir release
          status=0
          take() {
            local platform=$1 pattern=$2 file name
            for file in "signed/$platform"/*; do
              name=$(basename "$file")
              if ! [[ $name =~ $pattern ]]; then
                echo "::error::signed-$platform holds $name, which is not one of its files"
                status=1
              elif [ -e "release/$name" ]; then
                echo "::error::$name comes from more than one artifact"
                status=1
              else
                cp "$file" release/
              fi
            done
          }
          take darwin-universal '^(baum-desktop-darwin-universal(-unsigned|-unnotarized)?\.(dmg|(app\.tar\.gz|zip)(\.sig)?)|latest-mac\.yml)$'
          take linux '^(baum-desktop-linux-(amd64|arm64)\.(deb|AppImage)(\.sig)?|latest-linux(-arm64)?\.yml)$'
          exit "$status"

      - name: Install minisign
        run: |
          minisign=$(bash desktop/scripts/install-minisign.sh "$RUNNER_TEMP/minisign")
          echo "MINISIGN=$minisign" >>"$GITHUB_ENV"

      - name: Write and verify latest.json
        run: |
          shopt -s nullglob
          signatures=(release/*.sig)
          if [ "$UPDATER" != "$UPDATER_MACOS" ]; then
            echo "::error::the sign jobs disagree on whether the updater key is configured"
            exit 1
          fi
          if [ "$UPDATER" != true ]; then
            if [ "${#signatures[@]}" -ne 0 ]; then
              echo "::error::updater signatures exist although the updater key is not configured"
              exit 1
            fi
            # Installed apps take only signed updates, so the update files go too.
            rm -f release/latest*.yml
            echo "::warning::The release environment has no TAURI_SIGNING_PRIVATE_KEY: publishing without latest.json or the latest*.yml files, so installed apps are not offered this release."
            exit 0
          fi
          # Fails unless every required bundle carries a signature.
          bash desktop/scripts/updater-manifest.sh write "$VERSION" release
          # The Tauri copies still installed update to what latest.json
          # lists: it must be the Electron app ("Bridge release").
          bash desktop/scripts/updater-manifest.sh electron release
          # electron-updater's files: each must give the hashes of the files
          # beside it and announce this version, and every file they list
          # must carry the release key's signature for it.
          for required in latest-mac.yml latest-linux.yml; do
            if [ ! -f "release/$required" ]; then
              echo "::error::$required is missing"
              exit 1
            fi
          done
          # Each file they list is fetched from this release through
          # downloads.usebaum.com, as latest.json's bundles are: the
          # release candidates' channel holds only the update files.
          node desktop/scripts/update-yml.mjs publish "$VERSION" release >/dev/null
          files=()
          while IFS= read -r file; do files+=("release/$file"); done \
            < <(node desktop/scripts/update-yml.mjs check "$VERSION" release)
          bash desktop/scripts/updater-manifest.sh signed "$VERSION" "${files[@]}"
          {
            echo "### Updater manifest"
            echo
            echo '```json'
            cat release/latest.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Write checksums
        working-directory: release
        run: sha256sum -- * >desktop-checksums.txt

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    # The only desktop job with a token that can write: it runs no build
    # tooling, only gh and the attestation action.
    name: Publish the release
    needs: [desktop-manifest, test, desktop-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: release

      # Only the files a release ships, and every one it must ship.
      - name: Check the files
        run: |
          allowed='^(baum-desktop-darwin-universal(-unsigned|-unnotarized)?\.(dmg|(app\.tar\.gz|zip)(\.sig)?)|baum-desktop-linux-(amd64|arm64)\.(deb|AppImage)(\.sig)?|desktop-checksums\.txt|latest\.json|latest-(mac|linux|linux-arm64)\.yml)$'
          status=0
          for file in release/*; do
            if ! [[ $(basename "$file") =~ $allowed ]]; then
              echo "::error::unexpected file $(basename "$file")"
              status=1
            fi
          done
          # Exactly one of each, so no bundle is shipped under two names.
          expected=('baum-desktop-darwin-universal*.dmg' 'baum-desktop-darwin-universal*.zip'
            'baum-desktop-darwin-universal*.app.tar.gz' 'baum-desktop-linux-amd64.deb'
            'baum-desktop-linux-amd64.AppImage' desktop-checksums.txt)
          # The update files come with the manifest: all or none.
          if [ -f release/latest.json ]; then
            expected+=(latest-mac.yml latest-linux.yml)
          elif compgen -G 'release/latest*.yml' >/dev/null; then
            echo "::error::update files without latest.json"
            status=1
          fi
          for required in "${expected[@]}"; do
            mapfile -t matches < <(compgen -G "release/$required" || true)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected one $required, found ${#matches[@]}"
              status=1
            fi
          done
          exit "$status"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/baum-desktop-*

      # latest.json and the latest*.yml update files go last, so an app never
      # reads a manifest whose bundles are not there yet; the draft is
      # published only after them.
      - name: Attach and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          files=()
          manifests=()
          for file in release/*; do
            case "$(basename "$file")" in
              latest.json | latest*.yml) manifests+=("$file") ;;
              *) files+=("$file") ;;
            esac
          done
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if [ "${#manifests[@]}" -ne 0 ]; then
            gh release upload "$TAG" "${manifests[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # Release candidates read the manifests (latest.json and the latest*.yml
      # update files) on the desktop-rc-updates pre-release, so they move to
      # the next candidate or full release; full releases read the latest full
      # release's. Every release replaces it once
      # its own files are public, unless it holds a newer version already (a
      # re-run of an older release). A pre-release is never the latest
      # release, so this one never stands in for a full release.
      - name: Update the release candidates' manifest
        if: hashFiles('release/latest.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: desktop-rc-updates
        run: |
          version=$(jq -er .version release/latest.json)
          if ! gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CHANNEL" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Release-candidate updates (not a release)" \
              --notes "Holds the updater manifest that release candidates of the desktop app read. Download baum from the latest release instead."
          fi
          current=$(gh release download "$CHANNEL" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output - 2>/dev/null |
            jq -r '.version // empty' || true)
          # sort -V orders 1.2.3~rc.1 before 1.2.3, as semver orders
          # 1.2.3-rc.1 before 1.2.3.
          newest=$(printf '%s\n' "${version//-/\~}" "${current//-/\~}" | sort -V | tail -n 1)
          if [ -n "$current" ] && [ "$newest" != "${version//-/\~}" ]; then
            echo "::notice::$CHANNEL keeps $current, which is newer than $version."
            exit 0
          fi
          gh release upload "$CHANNEL" release/latest.json release/latest*.yml --repo "$GITHUB_REPOSITORY" --clobber
