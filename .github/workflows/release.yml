name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  viewer-dist:
    # The tag must carry the viewer bundle its sources build to.
    name: Viewer bundle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Rebuild and compare
        run: sh scripts/viewer-fresh.sh

  release:
    name: Release
    needs: [test, viewer-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser derives the changelog from the previous tag.
          fetch-depth: 0
          # goreleaser calls the release API with GITHUB_TOKEN from the
          # environment and never pushes, so no credentials stay in the clone.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Builds linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 and
      # windows/amd64 with CGO off, archives them, writes checksums.txt and
      # creates the GitHub release. See .goreleaser.yaml.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # The viewer-dist job, which has a read-only token, already checked
          # the bundle, so the before hook skips it: no JavaScript tooling
          # runs while this job holds a token that can write to the repository.
          BAUM_SKIP_VIEWER_FRESH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
