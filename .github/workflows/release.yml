name: Release

# On a version tag: goreleaser builds the CLI archives and creates the GitHub
# release; then the desktop app is bundled on each platform around those same
# baum binaries (desktop.yml), the updater manifest is written and verified,
# and the bundles and latest.json are attached to the same release. Signing
# secrets reach only the bundle jobs of this workflow, which runs only on tag
# pushes; actions are pinned to commits. See desktop/README.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  viewer-dist:
    # The tag must carry the viewer bundle its sources build to.
    name: Viewer bundle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Rebuild and compare
        run: sh scripts/viewer-fresh.sh

  release:
    name: Release
    needs: [test, viewer-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the changelog from the previous tag.
          fetch-depth: 0
          # goreleaser calls the release API with GITHUB_TOKEN from the
          # environment and never pushes, so no credentials stay in the clone.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Builds linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 and
      # windows/amd64 with CGO off, archives them, writes checksums.txt and
      # creates the GitHub release. See .goreleaser.yaml.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # The viewer-dist job, which has a read-only token, already checked
          # the bundle, so the before hook skips it: no JavaScript tooling
          # runs while this job holds a token that can write to the repository.
          BAUM_SKIP_VIEWER_FRESH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The desktop bundles carry these exact binaries.
      - name: Keep the baum binaries for the desktop app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: |
            dist/baum_*/baum
            dist/baum_*/baum.exe
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop
    needs: release
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
      cli-artifact: cli-binaries
    # Each is optional: signing a platform's bundles is skipped while its
    # secrets are unset.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}

  desktop-manifest:
    # Read-only: writes latest.json and checks every bundle against the
    # release key and the version before anything is published.
    name: Desktop updater manifest
    needs: [release, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Write and verify latest.json
        run: |
          if ! ls release/*.sig >/dev/null 2>&1; then
            echo "::warning::No updater signatures (TAURI_SIGNING_PRIVATE_KEY is unset): publishing the bundles without latest.json, so installed apps are not offered this release."
            exit 0
          fi
          bash desktop/scripts/updater-manifest.sh write "$VERSION" release
          {
            echo "### Updater manifest"
            echo
            echo '```json'
            cat release/latest.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    # The only desktop job with a token that can write: it runs no build
    # tooling, only gh.
    name: Publish the desktop app
    needs: desktop-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: release

      # latest.json goes last, so an app never reads a manifest whose
      # bundles are not there yet.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=()
          for file in release/*; do
            if [ "$(basename "$file")" != latest.json ]; then files+=("$file"); fi
          done
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -f release/latest.json ]; then
            gh release upload "$TAG" release/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          fi
