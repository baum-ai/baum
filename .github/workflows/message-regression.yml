name: Verify message regression

on:
  push:
    branches: [fix/public-ci-message-regression]

permissions:
  contents: read

jobs:
  native:
    name: Message regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test the message package
        run: go test -race ./internal/agentrequests
      - name: Repeat the corrected regression 100 times
        run: go test -race -count=100 ./internal/agentrequests -run '^TestMessages$'
