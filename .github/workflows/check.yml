name: Check

on:
  push:
    branches:
      - main
      # Published release branches; a tag is made only from a green commit.
      - release/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Native runs on every OS the release targets: the release snapshot only
    # cross-compiles, so OS-dependent behaviour would otherwise go untested.
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    # The macOS and Windows test runs alone take 12 to 15 minutes.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test release ordering and notes
        if: matrix.os == 'linux'
        run: |
          sh scripts/release-check-test.sh
          sh scripts/release-notes-test.sh

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      # A race-enabled binary sleeps a second as it exits, and the tests run
      # their own binary as a fake baum or cursor-agent hundreds of times.
      # Races are still reported; only the wait is skipped.
      # Windows runs without the race detector, which makes its tests several
      # times slower there; Linux and macOS still look for races. It also
      # skips internal/decisionlog, whose tests take over 7 minutes there (each
      # SQLite commit waits for FlushFileBuffers on the runner's disk) and run
      # the same code on the other two.
      - name: Test
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go list ./... | grep -v '/internal/decisionlog$' | xargs go test
          else
            go test -race ./...
          fi
        env:
          GORACE: atexit_sleep_ms=0

      - name: Check shipped marketplace files without cached results
        run: go test -count=1 ./hosted/agenthooks/

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  schema:
    # Kept separate from the Go job so a schema bump that breaks the example
    # document is named as such in the checks list.
    name: Schema validates example
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate review-example.json against review-1.json
        run: go test ./schema/... -run 'TestExampleValidates|TestRevision' -v

  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Lint, format, typecheck and unit tests.
      - name: Check
        run: pnpm check

      # Builds the standalone app from source and drives it in Chromium, with
      # fixtures standing in for what `the desktop daemon` serves.
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm test:e2e

      - name: Set up Go for the local app server fixture
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check and build local application
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build

      - name: Build local server browser fixture
        working-directory: .
        run: CGO_ENABLED=0 go test -c ./internal/uiserver -o app/e2e/fixture

      - name: Local application browser tests
        working-directory: app
        run: pnpm test:e2e && pnpm test:desktop

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: viewer-playwright-diagnostics
          path: |
            viewer/playwright-report/
            viewer/test-results/
          if-no-files-found: warn

  viewer-dist:
    # Every binary embeds internal/viewer/dist and internal/localapp/dist,
    # which only a release commit carries. Builds both, fails when a release
    # commit's built apps differ from the fresh build, tests the built apps and
    # hands them to the clean-install jobs.
    name: Viewer bundle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Rebuild and compare
        run: sh scripts/viewer-fresh.sh

      # The go job skips these without a build.
      - name: Test the built apps
        env:
          BAUM_REQUIRE_UI: "1"
        run: go test ./internal/viewer/... ./internal/localapp/... ./internal/viewserver/...

      - name: Keep the built apps for clean-install
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-apps
          path: |
            internal/viewer/dist
            internal/localapp/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  third-party-notices:
    # The notices shipped in the archives and the desktop bundles are
    # generated from go.mod and the pnpm lockfiles. Fails when the Go, npm or
    # Electron part, or what is assembled from the parts, is out of date.
    name: Third-party notices are current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Go notices and assembled files
        run: sh scripts/third-party-notices.sh check

      - name: npm notices
        run: |
          pnpm --dir viewer install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile
          node viewer/scripts/third-party-notices.mjs "$RUNNER_TEMP/js.txt"
          if ! cmp -s "$RUNNER_TEMP/js.txt" third_party/js.txt; then
            echo "third_party/js.txt is stale; run 'just third-party-notices' and commit the result" >&2
            exit 1
          fi

      # Electron's licence comes with its npm package; the binary is not needed.
      - name: Electron notices
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          pnpm --dir desktop install --frozen-lockfile --ignore-scripts
          bash desktop/scripts/third-party-notices.sh check

  clean-install:
    # What a user runs: go install from the module zip of a release commit,
    # with no Node.js on PATH, then a smoke test of the desktop daemon. The
    # apps come built from viewer-dist, as a release commit carries them.
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    needs: viewer-dist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Fetch the built apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-apps
          path: internal

      - name: Install and smoke test
        run: bash scripts/clean-install.sh

  release-snapshot:
    # Cross-compiles every release target so a platform-specific build break
    # is caught on the pull request, not on the tag.
    name: Release snapshot
    needs: viewer-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The before hook in .goreleaser.yaml rebuilds the viewer.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish

      - name: Verify the archives
        run: bash scripts/release-verify.sh

  desktop:
    # The Electron shell in desktop/: format check, typecheck, unit tests,
    # and the updater signing, manifest and update file checks. The
    # snapshot bundles (desktop-bundle) build it on every platform.
    name: Desktop app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check, typecheck and unit tests
        run: pnpm check

      # The release's updater signing, latest.json and latest*.yml checks:
      # tampered bundles, swapped or foreign signatures, wrong URLs, versions
      # the bundles were not signed for and stale update files are rejected.
      - name: Updater signing and manifest checks
        run: |
          bash scripts/updater-manifest-test.sh
          bash scripts/update-yml-test.sh

  updater-signing:
    # The release signs updater bundles on macOS and Windows runners with the
    # pinned minisign, reading the key's password from standard input. Run
    # the signing and manifest checks there with that binary, so a broken
    # download, checksum or password path shows before a release.
    name: Updater signing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned minisign
        run: |
          minisign=$(bash desktop/scripts/install-minisign.sh "$RUNNER_TEMP/minisign")
          echo "MINISIGN=$minisign" >>"$GITHUB_ENV"

      - name: Updater signing and manifest checks
        env:
          BAUM_RELEASE_SIGNING: "1"
        run: bash desktop/scripts/updater-manifest-test.sh

  desktop-shell:
    # The Electron shell in desktop/electron: its format check, typecheck and
    # unit tests, and the harness (desktop/tests/shell) that runs the built
    # app under Xvfb against a mock daemon (frame isolation, navigation and
    # the tile check window).
    name: Desktop app (Electron shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Ubuntu 24.04 keeps unprivileged user namespaces from Chromium and the
      # sandbox helper in node_modules is not setuid, so Chromium's process
      # sandbox cannot start here. The renderers keep Electron's sandbox
      # (sandboxed preload, context isolation).
      ELECTRON_DISABLE_SANDBOX: "1"
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Xvfb and Electron's libraries
        run: |
          missing=""
          for package in xvfb xauth dbus-x11 libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4 libsecret-1-0; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y --no-install-recommends $missing
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Build the React application and desktop setup
        working-directory: .
        run: pnpm --dir viewer install --frozen-lockfile && pnpm --dir app install --frozen-lockfile && pnpm --dir app build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Shell harness
        run: pnpm test:shell

      - name: Upload harness diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-shell-diagnostics
          path: desktop/build/shell-results/
          if-no-files-found: warn

  desktop-changes:
    # The snapshot bundles take 10 to 15 minutes, so they run only when a push
    # or pull request touches what the bundling depends on beyond the Go code
    # the go job builds: the desktop app, the local app it shows, and these
    # workflows. Without the commit to compare with (a new branch, or one the
    # fetch cannot reach) they run.
    name: Desktop changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bundle: ${{ steps.classify.outputs.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "bundle=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --no-renames "$BASE" HEAD | grep -qE '^(desktop/|app/|internal/localapp/|scripts/viewer-|\.github/workflows/(check|desktop)\.yml$)'; then
            echo "bundle=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "bundle=false" | tee -a "$GITHUB_OUTPUT"
          fi

  desktop-bundle:
    # Unsigned snapshot bundles for the platforms the release ships, built as
    # the release builds them (with baum built from source and the apps
    # viewer-dist built), so a bundling or signing-script break shows here
    # rather than on the tag. They are kept as workflow artifacts. The Windows
    # installer is built too, though the release skips it while Windows is
    # not released, so it keeps building.
    name: Desktop snapshot
    needs: [viewer-dist, desktop-changes]
    if: needs.desktop-changes.outputs.bundle == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version: 0.0.0
      apps-artifact: built-apps
      finalize-macos: true
      windows: true
