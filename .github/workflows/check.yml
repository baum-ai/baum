name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Native runs on every OS the release targets: the release snapshot only
    # cross-compiles, so OS-dependent behaviour would otherwise go untested.
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test release ordering
        if: matrix.os == 'linux'
        run: sh scripts/release-check-test.sh

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  schema:
    # Kept separate from the Go job so a schema bump that breaks the example
    # document is named as such in the checks list.
    name: Schema validates example
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate review-example.json against review-1.json
        run: go test ./schema/... -run 'TestExampleValidates|TestRevision' -v

  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Lint, format, typecheck (with the tile types generated from
      # ../schema/review-1.json) and unit tests.
      - name: Check
        run: pnpm check

      # Builds the standalone app from source and drives it in Chromium, with
      # fixtures standing in for what `baum internal view` serves.
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm test:e2e

      - name: Set up Go for the local app server fixture
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check and build local application
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build

      - name: Build local server browser fixture
        working-directory: .
        run: CGO_ENABLED=0 go test -c ./internal/uiserver -o app/e2e/fixture

      - name: Local application browser tests
        working-directory: app
        run: pnpm test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: viewer-playwright-diagnostics
          path: |
            viewer/playwright-report/
            viewer/test-results/
          if-no-files-found: warn

  viewer-dist:
    # Every binary embeds internal/viewer/dist and internal/localapp/dist,
    # which only a release commit carries. Builds both, fails when the
    # precompiled tile validators differ from the fresh build, tests the built
    # apps and hands them to the clean-install jobs.
    name: Viewer bundle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Rebuild and compare
        run: sh scripts/viewer-fresh.sh

      # The go job skips these without a build.
      - name: Test the built apps
        env:
          BAUM_REQUIRE_UI: "1"
        run: go test ./internal/viewer/... ./internal/localapp/... ./internal/viewserver/...

      - name: Keep the built apps for clean-install
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-apps
          path: |
            internal/viewer/dist
            internal/localapp/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  third-party-notices:
    # The notices shipped in the archives and the desktop bundles are
    # generated from go.mod, the pnpm lockfiles and Cargo.lock. Fails when the
    # Go or npm part, or what is assembled from the parts, is out of date.
    # The Rust part (third_party/rust.txt) needs cargo-about in the desktop
    # image; regenerate it with "just third-party-notices" in the monorepo.
    name: Third-party notices are current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Go notices and assembled files
        run: sh scripts/third-party-notices.sh check

      - name: npm notices
        run: |
          pnpm --dir viewer install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile
          node viewer/scripts/third-party-notices.mjs "$RUNNER_TEMP/js.txt"
          if ! cmp -s "$RUNNER_TEMP/js.txt" third_party/js.txt; then
            echo "third_party/js.txt is stale; run 'just third-party-notices' and commit the result" >&2
            exit 1
          fi

  clean-install:
    # What a user runs: go install from the module zip of a release commit,
    # with no Node.js on PATH, then a smoke test of baum internal view. The
    # apps come built from viewer-dist, as a release commit carries them.
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    needs: viewer-dist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Fetch the built apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-apps
          path: internal

      - name: Install and smoke test
        run: bash scripts/clean-install.sh

  release-snapshot:
    # Cross-compiles every release target so a platform-specific build break
    # is caught on the pull request, not on the tag.
    name: Release snapshot
    needs: viewer-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The before hook in .goreleaser.yaml rebuilds the viewer.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish

      - name: Verify the archives
        run: bash scripts/release-verify.sh

  desktop:
    # The Tauri shell in desktop/, natively on the platforms it ships for
    # first. Its tests use stand-in baum binaries, but every build needs the
    # bundled one, so it is built first.
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install WebKitGTK and GTK development packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev minisign

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Build the bundled baum binary
        working-directory: .
        run: sh desktop/scripts/sidecar.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # The release's updater signing and latest.json checks: tampered
      # bundles, swapped or foreign signatures, wrong URLs and versions the
      # bundles were not signed for are rejected.
      - name: Updater signing and manifest checks
        if: matrix.os == 'linux'
        run: bash scripts/updater-manifest-test.sh

  updater-signing:
    # The release signs updater bundles on macOS and Windows runners with the
    # pinned minisign, reading the key's password from standard input. Run
    # the signing and manifest checks there with that binary, so a broken
    # download, checksum or password path shows before a release.
    name: Updater signing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned minisign
        run: |
          minisign=$(bash desktop/scripts/install-minisign.sh "$RUNNER_TEMP/minisign")
          echo "MINISIGN=$minisign" >>"$GITHUB_ENV"

      - name: Updater signing and manifest checks
        env:
          BAUM_RELEASE_SIGNING: "1"
        run: bash desktop/scripts/updater-manifest-test.sh

  desktop-bundle:
    # Unsigned snapshot bundles for every platform the release ships, built
    # as the release builds them (with baum built from source and the apps
    # viewer-dist built), so a bundling or signing-script break shows here
    # rather than on the tag. They are kept as workflow artifacts.
    name: Desktop snapshot
    needs: viewer-dist
    uses: ./.github/workflows/desktop.yml
    with:
      version: 0.0.0
      apps-artifact: built-apps
      finalize-macos: true
