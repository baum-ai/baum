name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Native runs on every OS the release targets: the release snapshot only
    # cross-compiles, so OS-dependent behaviour would otherwise go untested.
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  schema:
    # Kept separate from the Go job so a schema bump that breaks the example
    # document is named as such in the checks list.
    name: Schema validates example
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate review-example.json against review-1.json
        run: go test ./schema/... -run 'TestExampleValidates|TestRevision' -v

  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Lint, format, typecheck (with the tile types generated from
      # ../schema/review-1.json) and unit tests.
      - name: Check
        run: pnpm check

      # Builds the standalone app from source and drives it in Chromium, with
      # fixtures standing in for what `baum internal view` serves.
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm test:e2e

      - name: Set up Go for the local app server fixture
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check and build local application
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build

      - name: Build local server browser fixture
        working-directory: .
        run: CGO_ENABLED=0 go test -c ./internal/uiserver -o app/e2e/fixture

      - name: Local application browser tests
        working-directory: app
        run: pnpm test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-playwright-diagnostics
          path: |
            viewer/playwright-report/
            viewer/test-results/
          if-no-files-found: warn

  viewer-dist:
    # Every binary embeds internal/viewer/dist, which is committed so that go
    # install needs no Node.js. Fails when it, or the precompiled tile
    # validators, differ from a fresh build of the viewer sources.
    name: Viewer bundle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Rebuild and compare
        run: sh scripts/viewer-fresh.sh

  clean-install:
    # What a user runs: go install from a module zip of the committed files,
    # with no Node.js on PATH, then a smoke test of baum internal view.
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install and smoke test
        run: bash scripts/clean-install.sh

  release-snapshot:
    # Cross-compiles every release target so a platform-specific build break
    # is caught on the pull request, not on the tag.
    name: Release snapshot
    needs: viewer-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The before hook in .goreleaser.yaml rebuilds the viewer.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Verify the archives
        run: bash scripts/release-verify.sh

  desktop:
    # The Tauri shell in desktop/, natively on the platforms it ships for
    # first. Its tests use stand-in baum binaries, but every build needs the
    # bundled one, so it is built first.
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install WebKitGTK and GTK development packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1

      - name: Cache Cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Build the bundled baum binary
        working-directory: .
        run: sh desktop/scripts/sidecar.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
