name: Feature request
description: Suggest something baum should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not paste anything private.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, before any solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like baum to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
