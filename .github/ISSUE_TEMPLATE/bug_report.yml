name: Bug report
description: Something in baum does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. baum sends no telemetry or crash reports, so this issue is the only way we hear about a problem.

        This issue is public. Check everything you paste for anything private. For a security vulnerability, follow [SECURITY.md](https://github.com/baum-ai/baum/blob/main/SECURITY.md) instead.

        In the desktop app, **Report a problem** (Help menu, tray menu or Diagnostics) opens this form with the version, OS and a redacted Diagnostics summary filled in.
  - type: input
    id: version
    attributes:
      label: baum version
      description: Shown by `baum --version`, or in the desktop app's About window.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example macOS 15 arm64, Windows 11, Ubuntu 24.04 amd64.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Coding agent harness and version
      description: Claude Code, Codex or Cursor Agent, with the version from `claude --version`, `codex --version` or `cursor-agent --version`. Write "none" if you do not use one.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected and what happened instead.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: The desktop app's Report a problem fills this in. Otherwise paste the output of `baum internal doctor --offline`, after checking it for private paths, names and anything secret. It reports where a token was found, never the token.
      render: text
