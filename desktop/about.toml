# cargo-about configuration for the notices of the crates compiled into the
# desktop app (scripts/third-party-notices.sh). Only crates that end up in the
# release binaries count: not dev-dependencies, and not build scripts.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The release targets (scripts/bundle.sh); a crate only one of them needs is listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
