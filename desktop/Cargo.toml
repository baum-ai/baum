[package]
name = "baum-desktop"
version = "0.0.0"
description = "The baum desktop app"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "baum-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
libc = "0.2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.13.3"
url = "2"

# The version wry uses, to end the check window's web process (check_window.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# The version wry uses, to hear the pointer leave the window (pointer.rs).
gtk = "0.18.2"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Proc macros and build scripts run only while compiling. Stripped, they no
# longer load on Xcode 27 (dyld: "mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
